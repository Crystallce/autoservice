<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0F172A">
  <title>АвтоСервис CRM</title>
  <meta name="description" content="Подъёмники, заявки и календарь автосервиса">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <img src="icons/icon-192.png" alt="" width="40" height="40">
        <div><div class="brand-name">АвтоСервис</div><div class="brand-sub">CRM для автосервиса</div></div>
      </div>
      <nav class="side-nav" id="side-nav"></nav>
      <div class="side-status" id="side-status"></div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-text">
          <h1 id="title">АвтоСервис</h1>
          <div id="subtitle" class="subtitle"></div>
        </div>
        <button class="icon-btn" id="refresh" aria-label="Обновить" title="Обновить">
          <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 7.75 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4z"/></svg>
        </button>
      </header>
      <div id="banner"></div>
      <div id="view" class="view"></div>
    </main>

    <nav class="tabbar" id="tabbar"></nav>
  </div>

  <div id="sheet"></div>
  <div id="toast" class="toast" role="status"></div>

  <script src="js/config.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
